<div class="auth-page">
  <div class="container" [class.right-panel-active]="signUpActive">
    <!-- Sign Up -->
    <div class="container__form container--signup">
      <form class="form" (ngSubmit)="onSignUp()" #signUpForm="ngForm">
        <h2 class="form__title">Create Account</h2>
        <p class="form__subtitle">Join SmartHire AI</p>

        <input type="text" placeholder="Username" class="input" name="signUpUsername"
               [(ngModel)]="signUp.username" required />
        <input type="email" placeholder="Email" class="input" name="signUpEmail"
               [(ngModel)]="signUp.email" required />
        <input type="password" placeholder="Password" class="input" name="signUpPassword"
               [(ngModel)]="signUp.password" required />

        <button type="submit" class="btn" [disabled]="loading">
          {{ loading ? 'Please wait…' : 'Sign Up' }}
        </button>
      </form>
    </div>

    <!-- Sign In -->
    <div class="container__form container--signin">
      <form class="form" (ngSubmit)="onSignIn()" #signInForm="ngForm">
        <h2 class="form__title">Welcome Back</h2>
        <p class="form__subtitle">Sign in to SmartHire AI</p>

        <input type="text" placeholder="Username" class="input" name="signInUsername"
               [(ngModel)]="signIn.username" required />
        <input type="password" placeholder="Password" class="input" name="signInPassword"
               [(ngModel)]="signIn.password" required />

        <div class="form__message" *ngIf="errorMessage">{{ errorMessage }}</div>
        <div class="form__message form__message--success" *ngIf="successMessage">{{ successMessage }}</div>

        <button type="submit" class="btn" [disabled]="loading">
          {{ loading ? 'Please wait…' : 'Sign In' }}
        </button>

        <button type="button" class="btn btn--ghost" (click)="ssoLogin()">
          Sign in with AuthBridge SSO
        </button>
      </form>
    </div>

    <!-- Overlay -->
    <div class="container__overlay">
      <div class="overlay">
        <div class="overlay__panel overlay--left">
          <h2 class="welcome">Welcome Back</h2>
          <p>Already have an account? Sign in to continue screening candidates.</p>
          <button class="btn btn--outline" type="button" (click)="activateSignIn()">Sign In</button>
        </div>
        <div class="overlay__panel overlay--right">
          <h2 class="welcome">Hello, Recruiter!</h2>
          <p>New to SmartHire AI? Create an account to get started.</p>
          <button class="btn btn--outline" type="button" (click)="activateSignUp()">Sign Up</button>
        </div>
      </div>
    </div>
  </div>
</div>
